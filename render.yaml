# Optional public Python backend deployment.
# Configure CORS_ORIGINS to your GitHub Pages origin in the hosting dashboard.
services:
  - type: web
    name: agrosat-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: CORS_ORIGINS
        sync: false
