name: Tests and build
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests
        env:
          PYTHONPATH: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python ../run.py --check
      - run: npm ci
      - run: npm run lint
      - run: npm run test:i18n
      - run: npm run build
      - run: node scripts/base-path-assets-check.mjs
  docker-quickstart:
    name: Clean clone — one command Docker launch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: Verify webpage, NASA API and crop comparison
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/illustrations/crop-wheat.svg > /dev/null
          python3 - <<'PY'
          import json, urllib.request
          base = 'http://127.0.0.1:8080'
          def get(path):
              return json.load(urllib.request.urlopen(base + path, timeout=10))
          health = get('/api/health')
          assert health['status']=='ok' and health['records']==9497, health
          year = get('/api/climate/2025')
          assert abs(year['total_precipitation_mm'] - 94.47) < 0.01, year
          req = urllib.request.Request(base+'/api/compare',
              data=b'{"water":"limited","salinity":"unknown","priority":"water"}',
              headers={'Content-Type':'application/json'},method='POST')
          result = json.load(urllib.request.urlopen(req, timeout=10))
          assert len(result['rotations'])==3, result
          print('PASS: clean Docker clone launches site + real NASA API + A/B/C comparison')
          PY
      - if: always()
        run: docker compose down --volumes --remove-orphans
